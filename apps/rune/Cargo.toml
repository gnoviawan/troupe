# Troupe's Rune workspace: the new Rust UI lives under `crates/`. It is its own
# Cargo workspace, a member of nothing else, and it pins one Rune `dev` rev —
# recorded in `rune.pin` — that `scripts/rune/check-pin.mjs` keeps equal to the
# `rune` dependency and every `[patch.crates-io]` entry below.
[workspace]
resolver = "3"
members = ["crates/app", "crates/automation", "crates/client", "crates/desktop", "crates/dev", "crates/editor", "crates/flow", "crates/gallery", "crates/hello", "crates/model", "crates/probe", "crates/term", "crates/theme", "crates/ui", "crates/web"]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
rune = { git = "https://github.com/anomalyco/rune.git", rev = "9d4b4636f1f7e6d172053a0b6469a334c0bfc227" }
# `rune::machine` without the UI stack, for crates that must not link a renderer
# (the client transport). Bump the rev with the `rune` pin above.
rune-core = { git = "https://github.com/anomalyco/rune.git", rev = "9d4b4636f1f7e6d172053a0b6469a334c0bfc227" }
# The lexers rune-kit's syntax module wraps, used bare by the editor crate, which links no UI.
rune-highlights = { git = "https://github.com/anomalyco/rune.git", rev = "9d4b4636f1f7e6d172053a0b6469a334c0bfc227" }
rune-kit = { git = "https://github.com/anomalyco/rune.git", rev = "9d4b4636f1f7e6d172053a0b6469a334c0bfc227", default-features = false }
serde_json = "1"
# Pinned to the wasm-bindgen in Rune's own Cargo.lock at the rev above;
# web-build.sh wants the CLI at this workspace's resolved version.
wasm-bindgen = "=0.2.129"

# The crates Rune patches in its own workspace (Rune's AGENTS.md, `vendor/`): a
# dependency's `[patch]` never reaches the workspace that depends on it, so apps
# that build Rune patch the same six crates against the pinned rev. Patch winit
# and sctk-adwaita together: Rune's winit calls the vendored frame's
# `AdwaitaFrame::content_corner_radius`. Bump the rev with the `rune` pin above.
[patch.crates-io]
winit = { git = "https://github.com/anomalyco/rune.git", rev = "9d4b4636f1f7e6d172053a0b6469a334c0bfc227" }
sctk-adwaita = { git = "https://github.com/anomalyco/rune.git", rev = "9d4b4636f1f7e6d172053a0b6469a334c0bfc227" }
parley_engine = { git = "https://github.com/anomalyco/rune.git", rev = "9d4b4636f1f7e6d172053a0b6469a334c0bfc227" }
wgpu-hal = { git = "https://github.com/anomalyco/rune.git", rev = "9d4b4636f1f7e6d172053a0b6469a334c0bfc227" }
accesskit_windows = { git = "https://github.com/anomalyco/rune.git", rev = "9d4b4636f1f7e6d172053a0b6469a334c0bfc227" }
accesskit_macos = { git = "https://github.com/anomalyco/rune.git", rev = "9d4b4636f1f7e6d172053a0b6469a334c0bfc227" }
