[package]
name = "probe"
version = "0.0.1"
edition.workspace = true
license.workspace = true
description = "troupe-probe: a command-line Troupe client on the Rune client transport"

[[bin]]
name = "troupe-probe"
path = "src/main.rs"

[dependencies]
client = { path = "../client" }
serde_json = "1"
troupe-protocol = { path = "../../../../crates/troupe-protocol" }

# Native only, like the client's own tungstenite: an untargeted dev-dependency
# puts tungstenite's tree into the wasm32 `cargo metadata` the web build reads.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
