[package]
name = "troupe-dev"
version = "0.0.1"
edition.workspace = true
license.workspace = true
description = "troupe-dev: the Rune desktop shell in a native window, connected to TROUPE_SERVER_URL with no launcher, with the live driver linked in."

[[bin]]
name = "troupe-dev"
path = "src/main.rs"

[dependencies]
automation = { path = "../automation", features = ["tooling"] }
client = { path = "../client" }
troupe-app = { path = "../app" }
