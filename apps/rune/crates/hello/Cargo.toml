[package]
name = "hello"
version = "0.0.1"
edition.workspace = true
license.workspace = true

# `cdylib` gives the wasm build web-build.sh picks; `rlib` gives the native
# binary and the integration test the same code.
[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Links the live driver (`automation`): `RUNE_DRIVE_SOCK=<path> hello` serves its socket.
tooling = ["dep:automation"]

[dependencies]
automation = { path = "../automation", features = ["tooling"], optional = true }
# `tooling` keeps the headless agent flags (`--snap`, `--tree`, `--script`, ...)
# linked into release builds; debug builds always have them.
rune = { workspace = true, features = ["tooling"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
