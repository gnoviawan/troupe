[package]
name = "ui"
version = "0.0.1"
edition.workspace = true
license.workspace = true
description = "Troupe's base components (components/ui) for the Rune client."

[dependencies]
rune = { workspace = true }
theme = { path = "../theme" }
model = { path = "../model" }
rune-kit = { workspace = true, features = ["markdown", "mermaid"] }
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
sha1 = "0.10"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
web-sys = { version = "0.3.106", features = ["console", "EventTarget", "History", "PopStateEvent", "Window"] }
