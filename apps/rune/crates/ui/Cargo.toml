[package]
name = "ui"
version = "0.0.1"
edition.workspace = true
license.workspace = true
description = "Troupe's base components (components/ui) for the Rune client."

[dependencies]
rune = { workspace = true }
theme = { path = "../theme" }
model = { path = "../model" }
troupe-term = { path = "../term" }
troupe-editor = { path = "../editor" }
rune-kit = { workspace = true, features = ["markdown", "mermaid"] }
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
log = "0.4"
base64 = "0.22"
# Decodes Chromium's 3-scan non-interleaved baseline JPEGs accurately (zune-jpeg 0.5 mis-decodes them green).
jpeg-decoder = { version = "0.3", default-features = false }
# PDF pages rasterised on the CPU, the same on native and wasm (`docs/rune/decisions.md`, "PDF engine").
hayro = { version = "0.9", default-features = false, features = ["embed-fonts"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The video viewer stages a clip for ffmpeg in a private temporary file.
tempfile = "3"

[dev-dependencies]
sha1 = "0.10"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
js-sys = "0.3"
web-sys = { version = "0.3.106", features = ["Blob", "BlobPropertyBag", "CanvasRenderingContext2d", "console", "Document", "Element", "EventTarget", "History", "HtmlCanvasElement", "HtmlElement", "HtmlMediaElement", "HtmlVideoElement", "ImageData", "PopStateEvent", "Url", "Window"] }
