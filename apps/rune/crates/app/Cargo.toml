[package]
name = "troupe-app"
version = "0.0.1"
edition.workspace = true
license.workspace = true
description = "Troupe's Rune app root: connects to a Troupe server and draws the workspace shell. The web and desktop entries share it."

[dependencies]
client = { path = "../client" }
log = "0.4"
troupe-editor = { path = "../editor" }
troupe-flow = { path = "../flow" }
model = { path = "../model" }
rune = { workspace = true, features = ["tooling"] }
rune-kit = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
theme = { path = "../theme" }
troupe-protocol = { path = "../../../../crates/troupe-protocol" }
troupe-term = { path = "../term" }
regex-lite = "0.1"
ui = { path = "../ui" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
wasm-bindgen = { workspace = true }
web-sys = { version = "0.3", features = ["MediaQueryList", "Window"] }
