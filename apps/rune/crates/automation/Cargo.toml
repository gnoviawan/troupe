[package]
name = "automation"
version = "0.0.1"
edition.workspace = true
license.workspace = true

# Without `tooling`, or off Unix, `install` returns the app unchanged and the
# crate links nothing else.
[features]
tooling = ["dep:log", "dep:serde", "dep:serde_json", "dep:wgpu"]

[dependencies]
rune = { workspace = true }
log = { version = "0.4", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
# Rune does not re-export wgpu; this matches its `~30.0.1` so `Frame::format` is the same type.
wgpu = { version = "~30.0.1", default-features = false, optional = true }

[dev-dependencies]
hello = { path = "../hello" }
serde_json = "1"

# Run with `cargo test --all-features`.
[[test]]
name = "hello_drive"
required-features = ["tooling"]
