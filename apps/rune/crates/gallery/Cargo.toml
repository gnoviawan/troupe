[package]
name = "gallery"
version = "0.0.1"
edition.workspace = true
license.workspace = true
description = "Troupe's design-system gallery on Rune: one scene per design-system registry entry."

# `cdylib` is the wasm build web-build.sh picks; `rlib` gives the native binary and the tests
# the same code.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# `tooling` keeps `--snap`, `--tree` and `--list-scenes` in release builds.
rune = { workspace = true, features = ["tooling"] }
theme = { path = "../theme" }
ui = { path = "../ui" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
