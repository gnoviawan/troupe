[package]
name = "theme"
version = "0.0.1"
edition.workspace = true
license.workspace = true
description = "Troupe's bundled themes, fonts and icons as data for the Rune client."

[dependencies]
rune = { workspace = true }
rune-kit = { workspace = true }
serde_json = { workspace = true }
log = "0.4"

[dev-dependencies]
rune-kit = { workspace = true }
serde_json = { workspace = true }
# `--snap` for the swatch example in release builds.
rune = { workspace = true, features = ["tooling"] }

[[example]]
name = "theme-swatches"
path = "examples/theme_swatches.rs"
