[package]
name = "troupe-editor"
version = "0.0.1"
edition.workspace = true
license.workspace = true
description = "Troupe's code editor model for the Rune client: a rope buffer with undo, the caret and its moves, soft wrap, find and replace, go to line, and syntax tags. No UI and no I/O."

[dependencies]
regex-lite = "0.1"
rune-highlights = { workspace = true }
ropey = { version = "1.6", default-features = false, features = ["simd"] }
