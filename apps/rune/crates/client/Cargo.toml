[package]
name = "client"
version = "0.0.1"
edition.workspace = true
license.workspace = true
description = "Troupe's transport: HTTP, /ws and /terminal/ws as pure state machines with native and wasm socket backends"

[dependencies]
log = "0.4"
rune-core = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
troupe-protocol = { path = "../../../../crates/troupe-protocol" }

# TLS for `https://` and `wss://` hosts (a tunnel, a remote server): rustls on
# ring, checked by the OS verifier like the desktop app's reqwest.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7"
tungstenite = { version = "0.28", default-features = false, features = ["handshake", "rustls-tls-native-roots"] }
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
  "AbortSignal",
  "BinaryType",
  "CloseEvent",
  "Event",
  "Headers",
  "MessageEvent",
  "Request",
  "RequestInit",
  "Response",
  "WebSocket",
  "Window",
] }
