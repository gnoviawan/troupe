[package]
name = "troupe-web"
version = "0.0.1"
edition.workspace = true
license.workspace = true
description = "The Rune web client's wasm entry: reads the device and token from localStorage and starts the app root against the page's own server."

# `cdylib` is the wasm module web-build.sh picks; `rlib` lets `cargo test` build it natively.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
client = { path = "../client" }
troupe-app = { path = "../app" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
log = "0.4"
wasm-bindgen = { workspace = true }
web-sys = { version = "0.3", features = ["Location", "Storage", "Window"] }
