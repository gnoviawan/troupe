[package]
name = "model"
version = "0.0.1"
edition.workspace = true
license.workspace = true
description = "Troupe's client state for the Rune shell: plain state types and step functions, no UI and no I/O"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
sha1 = "0.10"
# Exact float parsing, so recorded sizes compare bit for bit; recorded key
# order kept, so object order (shortcut conflicts) matches JavaScript.
serde_json = { workspace = true, features = ["float_roundtrip", "preserve_order"] }
