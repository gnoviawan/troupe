name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changelog:
    name: Generate Changelog
    runs-on: ubuntu-latest
    outputs:
      changelog: ${{ steps.cliff.outputs.content }}
      normalized_version: ${{ steps.version.outputs.normalized_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generate changelog
        id: cliff
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Normalize tag version
        id: version
        shell: bash
        run: |
          source scripts/release/homebrew.sh
          VERSION="$(normalize_release_version "$GITHUB_REF_NAME")"
          # Every v* tag ships to all Stable users; prereleases and build
          # metadata belong to the nightly channel.
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must be vX.Y.Z; got $GITHUB_REF_NAME." >&2
            exit 1
          fi
          echo "normalized_version=$VERSION" >> "$GITHUB_OUTPUT"

  create_release:
    name: Create Draft Release
    needs: changelog
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.releaseId }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2
        with:
          egress-policy: audit

      - name: Create or update draft release
        id: release
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          RELEASE_BODY: ${{ needs.changelog.outputs.changelog }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tagName = context.ref.replace('refs/tags/', '')
            const releaseName = `Troupe ${tagName}`
            const releaseBody = process.env.RELEASE_BODY || ''

            let release
            try {
              const existing = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: tagName,
              })
              release = await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: existing.data.id,
                tag_name: tagName,
                name: releaseName,
                body: releaseBody,
                draft: existing.data.draft,
              })
            } catch (error) {
              if (error.status !== 404) throw error
              release = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tagName,
                name: releaseName,
                body: releaseBody,
                draft: true,
              })
            }
            core.setOutput('releaseId', String(release.data.id))

  # The MCP catalog snapshot (spine AD-3) is fetched in its own job, with no
  # secrets and read-only contents, never in build.rs. The build jobs swap it in
  # for the committed dev fixture in src-tauri/resources/mcp-registry/ before
  # cargo embeds it; the job summary records its sha256 and fetch time. If the
  # registry is unreachable at tag time this job fails the release rather than
  # ship the dev fixture. Rerun the failed jobs once the registry is back.
  mcp-snapshot:
    name: Fetch MCP registry snapshot
    needs: changelog
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.x

      - name: Fetch the registry snapshot
        run: bun scripts/fetch-mcp-registry-snapshot.mjs --out mcp-registry-snapshot

      - name: Verify and record the snapshot sha256
        shell: bash
        run: |
          bun scripts/fetch-mcp-registry-snapshot.mjs --verify mcp-registry-snapshot
          {
            echo '### MCP registry snapshot'
            echo '```json'
            cat mcp-registry-snapshot/mcp-registry-snapshot.meta.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the snapshot
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: mcp-registry-snapshot
          path: mcp-registry-snapshot/
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build (${{ matrix.platform }})
    needs: [changelog, mcp-snapshot]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-latest
            rust_target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc
          - platform: linux-x64
            runner: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            args: --target x86_64-unknown-linux-gnu
          - platform: macos-aarch64
            runner: macos-latest
            rust_target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: macos-x64
            runner: macos-15-intel
            rust_target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
    steps:
      - name: Harden runner
        if: matrix.runner == 'ubuntu-22.04'
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Preflight Apple and updater credentials
        if: startsWith(matrix.platform, 'macos-')
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          missing=()
          for name in \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            APPLE_ID \
            APPLE_PASSWORD \
            APPLE_TEAM_ID \
            TAURI_SIGNING_PUBLIC_KEY \
            TAURI_SIGNING_PRIVATE_KEY \
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if [[ "${#missing[@]}" -ne 0 ]]; then
            printf 'Missing required macOS release credential categories:\n' >&2
            printf '  - %s\n' "${missing[@]}" >&2
            exit 1
          fi

      - name: Import Apple Developer certificate
        if: startsWith(matrix.platform, 'macos-')
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          keychain_password="$(openssl rand -base64 32)"
          p12="$RUNNER_TEMP/certificate.p12"
          keychain="$RUNNER_TEMP/build.keychain-db"
          rm -f "$p12"
          trap 'rm -f "$p12"' EXIT
          printf '%s' "$APPLE_CERTIFICATE" | openssl base64 -d -A > "$p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security default-keychain -s "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -t 3600 -u "$keychain"
          security import "$p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          if ! security find-identity -v -p codesigning "$keychain" | grep -F "$APPLE_SIGNING_IDENTITY" >/dev/null; then
            echo "Imported keychain does not contain the configured signing identity." >&2
            exit 1
          fi

      - name: Install Linux dependencies
        if: matrix.runner == 'ubuntu-22.04'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            patchelf

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.x

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Install Bun dependencies
        run: bun install --frozen-lockfile

      - name: Align app versions with tag
        env:
          TAG_VERSION: ${{ needs.changelog.outputs.normalized_version }}
        run: bun scripts/align-version.ts

      # Build the Vite WEB bundle (dist-web/) BEFORE the desktop release build so
      # rust-embed embeds it into the desktop binary (the desktop's in-process
      # shared-live server serves this embedded bundle in a release install
      # without dist-web/ on disk). tauri-action's beforeBuildCommand only builds
      # the tauri renderer (dist-tauri/); dist-web/ is separate + gitignored, so
      # it must be built here. A missing dist-web/ fails the release build
      # clearly via the web_embed_missing compile_error in assets.rs.
      - name: Build web client (dist-web/)
        run: bun run build:web

      - name: Assert dist-web/index.html exists
        shell: bash
        run: test -f dist-web/index.html && test -s dist-web/index.html

      # The figcraft canvas bundle is embedded alongside dist-web/ (spine
      # AD-24): fetched by the pin in canvas/figcraft.pin, sha256 verified, and
      # unpacked to canvas/bundle/ before the cargo build.
      - name: Check figcraft pin
        run: bun scripts/canvas/check-figcraft-pin.mjs

      - name: Fetch and verify figcraft bundle (canvas/bundle/)
        run: bun scripts/canvas/fetch-figcraft-bundle.mjs

      - name: Assert canvas/bundle/index.html exists
        shell: bash
        run: test -f canvas/bundle/index.html && test -s canvas/bundle/index.html

      - name: Swap in the release MCP registry snapshot
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: mcp-registry-snapshot
          path: src-tauri/resources/mcp-registry

      - name: Verify the embedded MCP registry snapshot
        run: bun scripts/fetch-mcp-registry-snapshot.mjs --verify src-tauri/resources/mcp-registry

      # Tauri ignores the stapler's exit status, so a transient CloudKit failure
      # (macos-15-intel has dropped the connection with NSURLErrorDomain -1005)
      # ships an unstapled .app inside the DMG and updater archive (#1388).
      # Shadow xcrun so `stapler staple` retries and logs its output.
      - name: Retry stapler staple during the macOS build
        if: startsWith(matrix.platform, 'macos-')
        shell: bash
        run: |
          set -euo pipefail
          shim_dir="$RUNNER_TEMP/xcrun-shim"
          mkdir -p "$shim_dir"
          cat > "$shim_dir/xcrun" <<'SH'
          #!/bin/bash
          set -o pipefail
          if [[ "${1-}" == stapler && "${2-}" == staple ]]; then
            for delay in 0 15 30 60 120; do
              sleep "$delay"
              /usr/bin/xcrun "$@" 2>&1 | tee -a "$RUNNER_TEMP/stapler-staple.log" && exit 0
            done
            exit 1
          fi
          exec /usr/bin/xcrun "$@"
          SH
          chmod +x "$shim_dir/xcrun"
          echo "$shim_dir" >> "$GITHUB_PATH"

      - name: Build platform artifacts locally
        id: tauri
        uses: tauri-apps/tauri-action@fce9c6108b31ea247710505d3aaaa893ee6768d4 # v0
        env:
          TAURI_SIGNING_PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.platform, 'macos-') && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ startsWith(matrix.platform, 'macos-') && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ startsWith(matrix.platform, 'macos-') && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ startsWith(matrix.platform, 'macos-') && secrets.APPLE_TEAM_ID || '' }}
        with:
          tauriScript: bun run tauri
          args: ${{ matrix.args }} --config src-tauri/tauri.conf.prod.json

      - name: Persist Tauri artifact paths
        shell: bash
        env:
          ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
        run: printf '%s\n' "$ARTIFACT_PATHS" > tauri-artifact-paths.json

      - name: Require updater signatures
        shell: bash
        env:
          ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
        run: |
          node - <<'NODE'
          const paths = JSON.parse(process.env.ARTIFACT_PATHS || '[]')
          if (!Array.isArray(paths) || !paths.some((path) => path.endsWith('.sig'))) {
            throw new Error('Tauri produced no updater signatures; check the updater signing secrets.')
          }
          NODE
      # tauri-action notarizes + staples the .app only; the DMG is signed but
      # never submitted, so spctl --assess --type open on it fails with
      # source=Unnotarized Developer ID. Notarize + staple the DMG itself so
      # the verify step (and Gatekeeper on user machines) accepts it.
      - name: Notarize and staple macOS DMG
        if: startsWith(matrix.platform, 'macos-')
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          if [[ ! -s "$RUNNER_TEMP/stapler-staple.log" ]]; then
            echo "Tauri's stapler staple never reached the xcrun shim." >&2
            exit 1
          fi
          echo "::group::Tauri .app staple output"
          cat "$RUNNER_TEMP/stapler-staple.log"
          echo "::endgroup::"
          dmgs=("src-tauri/target/$RUST_TARGET/release/bundle/dmg"/*.dmg)
          if [[ "${#dmgs[@]}" -ne 1 ]]; then
            echo "Expected exactly one macOS DMG before notarization." >&2
            exit 1
          fi
          xcrun notarytool submit "${dmgs[0]}" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "${dmgs[0]}"

      - name: Verify macOS bundle library portability and signing
        if: startsWith(matrix.platform, 'macos-')
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          bundle_dir="src-tauri/target/$RUST_TARGET/release/bundle"
          app_bundles=("$bundle_dir/macos"/*.app)
          dmgs=("$bundle_dir/dmg"/*.dmg)
          if [[ "${#app_bundles[@]}" -ne 1 || "${#dmgs[@]}" -ne 1 ]]; then
            echo "Expected exactly one macOS app and one DMG before verification." >&2
            exit 1
          fi

          app="${app_bundles[0]}"
          dmg="${dmgs[0]}"
          info_plist="$app/Contents/Info.plist"
          executable_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$info_plist")"
          if [[ -z "$executable_name" || "$executable_name" == */* ]]; then
            echo "Invalid CFBundleExecutable in $info_plist: ${executable_name:-empty}" >&2
            exit 1
          fi
          executable="$app/Contents/MacOS/$executable_name"
          if [[ ! -f "$executable" || ! -x "$executable" ]]; then
            echo "Declared bundle executable is missing or not executable: $executable" >&2
            exit 1
          fi
          sidecar="$app/Contents/MacOS/rg"
          if [[ ! -f "$sidecar" || ! -x "$sidecar" ]]; then
            echo "Bundled ripgrep is missing or not executable: $sidecar" >&2
            exit 1
          fi

          dependencies="$(otool -L "$executable")"
          rpaths="$(otool -l "$executable" | awk '
            $1 == "cmd" && $2 == "LC_RPATH" { in_rpath = 1; next }
            in_rpath && $1 == "path" { print $2; in_rpath = 0 }
          ')"
          printf '%s\n' "$dependencies"
          printf 'LC_RPATH entries:\n%s\n' "${rpaths:-  (none)}"

          forbidden=()
          while IFS= read -r dependency; do
            [[ -z "$dependency" ]] && continue
            case "$dependency" in
              /System/Library/*|/usr/lib/*|@rpath/*|@loader_path/*|@executable_path/*) ;;
              /usr/local/*|/opt/homebrew/*)
                forbidden+=("$dependency (Homebrew/local prefix)") ;;
              /*)
                forbidden+=("$dependency (runner-local absolute path)") ;;
              *)
                forbidden+=("$dependency (unexpected relative load path)") ;;
            esac
          done < <(
            printf '%s\n' "$dependencies" |
              tail -n +2 |
              sed -E 's/^[[:space:]]*([^[:space:]]+).*/\1/'
          )

          while IFS= read -r rpath; do
            [[ -z "$rpath" ]] && continue
            case "$rpath" in
              /System/Library/*|/usr/lib/*|@loader_path/*|@executable_path/*) ;;
              /usr/local/*|/opt/homebrew/*)
                forbidden+=("$rpath (Homebrew/local LC_RPATH)") ;;
              *)
                forbidden+=("$rpath (non-portable LC_RPATH)") ;;
            esac
          done <<< "$rpaths"

          if [[ "${#forbidden[@]}" -ne 0 ]]; then
            printf 'Forbidden Mach-O paths in %s:\n' "$executable" >&2
            printf '  %s\n' "${forbidden[@]}" >&2
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=4 "$app"
          xcrun stapler validate "$app"
          codesign --verify --strict --verbose=2 "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg"
          xcrun stapler validate "$dmg"

      - name: Collect platform release assets and updater manifest
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ needs.changelog.outputs.normalized_version }}
          TAG: ${{ github.ref_name }}
        run: |
          node scripts/release/prepare-platform-artifacts.mjs \
            --platform "$PLATFORM" \
            --version "$VERSION" \
            --tag "$TAG" \
            --artifacts tauri-artifact-paths.json \
            --output collected

      # The v0.4.60 install.sh downloads Termul.Manager_* assets from the latest
      # release. See scripts/release/legacy-install-assets.sh.
      - name: Add the asset names the v0.4.60 install.sh downloads
        if: matrix.platform != 'windows-x64'
        id: legacy_assets
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ needs.changelog.outputs.normalized_version }}
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          source scripts/release/legacy-install-assets.sh
          app=""
          if [[ "$PLATFORM" == macos-* ]]; then
            app_bundles=("src-tauri/target/$RUST_TARGET/release/bundle/macos"/*.app)
            if [[ "${#app_bundles[@]}" -ne 1 ]]; then
              echo "Expected exactly one macOS app for the legacy DMG." >&2
              exit 1
            fi
            app="${app_bundles[0]}"
          fi
          legacy="$(add_legacy_install_assets "$PLATFORM" "$VERSION" collected/assets "$app")"
          printf 'path=%s\n' "$legacy" >> "$GITHUB_OUTPUT"
          ls -l collected/assets

      - name: Sign, notarize and verify the legacy macOS DMG
        if: startsWith(matrix.platform, 'macos-') && steps.legacy_assets.outputs.path != ''
        shell: bash
        env:
          DMG: ${{ steps.legacy_assets.outputs.path }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$DMG"
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$DMG"
          codesign --verify --strict --verbose=2 "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$DMG"
          xcrun stapler validate "$DMG"
          mount_dir="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount_dir" "$DMG"
          trap 'hdiutil detach "$mount_dir" >/dev/null 2>&1 || true' EXIT
          codesign --verify --deep --strict --verbose=2 "$mount_dir/Termul Manager.app"
          spctl --assess --type execute --verbose=4 "$mount_dir/Termul Manager.app"
          xcrun stapler validate "$mount_dir/Termul Manager.app"

      - name: Upload platform workflow artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: release-${{ matrix.platform }}
          path: collected/
          if-no-files-found: error
          retention-days: 1

  # Standalone headless server for VPS deploy (Story 1.2 scaffold).
  # Build sequencing: bun run build:web MUST run before the cargo release
  # build so rust-embed embeds dist-web/ into the binary (Story 1.11 - a
  # missing/stale dist-web/ now fails the release build clearly via the
  # web_embed_missing compile_error in assets.rs; the ordering here keeps the
  # embed non-empty).
  standalone-server:
    name: Build troupe-server (linux-${{ matrix.arch }})
    needs: [changelog, mcp-snapshot]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            asset_name: troupe-server
            platform_key: linux-x86_64-server
            elf_machine: 'x86-64'
          - arch: arm64
            runner: ubuntu-22.04-arm
            rust_target: aarch64-unknown-linux-gnu
            asset_name: troupe-server-linux-aarch64
            platform_key: linux-aarch64-server
            elf_machine: 'ARM aarch64'
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            patchelf

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.x

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          cache-on-failure: false

      - name: Install Bun dependencies
        run: bun install --frozen-lockfile

      - name: Align app versions with tag
        env:
          TAG_VERSION: ${{ needs.changelog.outputs.normalized_version }}
        run: bun scripts/align-version.ts

      # ORDER MATTERS: web bundle before troupe-server release build (rust-embed).
      - name: Build web client (dist-web/)
        run: bun run build:web

      - name: Assert dist-web/index.html exists
        run: test -f dist-web/index.html && test -s dist-web/index.html

      - name: Check figcraft pin
        run: bun scripts/canvas/check-figcraft-pin.mjs

      - name: Fetch and verify figcraft bundle (canvas/bundle/)
        run: bun scripts/canvas/fetch-figcraft-bundle.mjs

      - name: Assert canvas/bundle/index.html exists
        run: test -f canvas/bundle/index.html && test -s canvas/bundle/index.html

      - name: Swap in the release MCP registry snapshot
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: mcp-registry-snapshot
          path: src-tauri/resources/mcp-registry

      - name: Verify the embedded MCP registry snapshot
        run: bun scripts/fetch-mcp-registry-snapshot.mjs --verify src-tauri/resources/mcp-registry

      - name: Build troupe-server (linux-${{ matrix.arch }} release)
        working-directory: src-tauri
        # Bake the signing pubkey into the binary at compile time so the opt-in
        # self-update subsystem can verify downloaded binaries (option_env!).
        env:
          TAURI_SIGNING_PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
        run: >
          cargo build --release --bin troupe-server
          --features standalone-server

      - name: Locate troupe-server binary
        working-directory: src-tauri
        shell: bash
        run: |
          echo "Searching for troupe-server binary in target/..."
          find target -name 'troupe-server' -type f -print || true
          ls -la target/release/troupe-server 2>/dev/null || echo "target/release/troupe-server NOT FOUND"

      - name: Verify troupe-server binary architecture
        working-directory: src-tauri
        env:
          ELF_MACHINE: ${{ matrix.elf_machine }}
        run: |
          file target/release/troupe-server
          file target/release/troupe-server | grep -F "$ELF_MACHINE"

      - name: Sign troupe-server binary
        working-directory: src-tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          bun run tauri signer sign "$(pwd)/target/release/troupe-server"
          test -f "$(pwd)/target/release/troupe-server.sig"

      - name: Prepare server manifest fragment
        shell: bash
        env:
          VERSION: ${{ needs.changelog.outputs.normalized_version }}
          TAG: ${{ github.ref_name }}
          ASSET_NAME: ${{ matrix.asset_name }}
          PLATFORM_KEY: ${{ matrix.platform_key }}
        run: |
          node scripts/release/prepare-server-artifacts.mjs \
            --signature src-tauri/target/release/troupe-server.sig \
            --binary-name "$ASSET_NAME" \
            --platform-key "$PLATFORM_KEY" \
            --tag "$TAG" \
            --version "$VERSION" \
            --output server-collected/server-manifest.json

      - name: Stage troupe-server binary + signature
        shell: bash
        env:
          ASSET_NAME: ${{ matrix.asset_name }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p server-collected
          cp src-tauri/target/release/troupe-server "server-collected/$ASSET_NAME"
          cp src-tauri/target/release/troupe-server.sig "server-collected/$ASSET_NAME.sig"
          # The API spec is the same on every arch; the x64 build emits it.
          if [[ "$ARCH" == "x64" ]]; then
            src-tauri/target/release/troupe-server openapi > server-collected/openapi.yaml
          fi

      - name: Upload troupe-server workflow artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: release-standalone-server-${{ matrix.arch }}
          # Single root so upload-artifact's least-common-ancestor doesn't
          # collapse to the workspace root (which would re-prefix every path).
          path: server-collected/
          if-no-files-found: error
          retention-days: 1

  publish_release:
    name: Validate, upload, and publish release
    needs: [changelog, create_release, build, standalone-server]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download all platform workflow artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: release-*
          path: release-inputs

      - name: Validate and merge release inputs
        env:
          VERSION: ${{ needs.changelog.outputs.normalized_version }}
          RELEASE_BODY: ${{ needs.changelog.outputs.changelog }}
        run: |
          expected=(windows-x64 linux-x64 macos-aarch64 macos-x64)
          manifests=()
          mkdir -p release-assets
          printf '%s' "$RELEASE_BODY" > release-notes.md

          for platform in "${expected[@]}"; do
            root="release-inputs/release-$platform"
            manifest="$root/platform-manifest.json"
            if [[ ! -s "$manifest" || ! -d "$root/assets" ]]; then
              echo "Missing collected release input for $platform" >&2
              exit 1
            fi
            manifests+=("$manifest")
            while IFS= read -r -d '' asset; do
              name="$(basename "$asset")"
              if [[ -e "release-assets/$name" ]] && ! cmp -s "$asset" "release-assets/$name"; then
                echo "Conflicting duplicate release asset: $name" >&2
                exit 1
              fi
              cp "$asset" "release-assets/$name"
            done < <(find "$root/assets" -maxdepth 1 -type f -print0)
          done

          # Standalone server binaries: one workflow artifact per arch
          # (<arch>:<asset>:<legacy asset>:<key>). Both are required so a release
          # never ships without an arm64 server. The legacy termul-server names
          # are byte-identical copies for scripts and old Dockerfiles that
          # download by name; the manifest points at the troupe-server names.
          for entry in x64:troupe-server:termul-server:linux-x86_64-server arm64:troupe-server-linux-aarch64:termul-server-linux-aarch64:linux-aarch64-server; do
            IFS=: read -r server_arch server_asset legacy_asset server_key <<< "$entry"
            server_root="release-inputs/release-standalone-server-$server_arch"
            if [[ ! -s "$server_root/server-manifest.json" || ! -s "$server_root/$server_asset" || ! -s "$server_root/$server_asset.sig" ]]; then
              echo "Missing collected standalone server input for $server_arch" >&2
              exit 1
            fi
            node -e '
              const [file, key, asset] = process.argv.slice(1);
              const record = JSON.parse(require("fs").readFileSync(file, "utf8")).platforms?.[key];
              if (!record || !record.url.endsWith("/" + asset)) {
                console.error(`Server manifest ${file} must map ${key} to ${asset}`);
                process.exit(1);
              }
            ' "$server_root/server-manifest.json" "$server_key" "$server_asset"
            cp "$server_root/$server_asset" "release-assets/$server_asset"
            cp "$server_root/$server_asset.sig" "release-assets/$server_asset.sig"
            cp "$server_root/$server_asset" "release-assets/$legacy_asset"
            cp "$server_root/$server_asset.sig" "release-assets/$legacy_asset.sig"
            manifests+=("$server_root/server-manifest.json")
          done

          spec="release-inputs/release-standalone-server-x64/openapi.yaml"
          if [[ ! -s "$spec" ]]; then
            echo "Missing openapi.yaml from the x64 standalone server build" >&2
            exit 1
          fi
          cp "$spec" release-assets/openapi.yaml

          PUB_DATE="$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')"
          node scripts/release/merge-updater-manifests.mjs \
            --channel stable \
            latest-stable.json "$VERSION" release-notes.md "$PUB_DATE" "${manifests[@]}"

          # The `latest.json` alias keeps the Tauri updater plugin's build-time
          # endpoint (which cannot be overridden per check from the renderer)
          # resolving for stable users.
          cp latest-stable.json latest.json

          release_file_count=0
          while IFS= read -r -d '' _release_file; do
            release_file_count=$((release_file_count + 1))
          done < <(find release-assets -maxdepth 1 -type f -print0)
          if [[ "$release_file_count" -eq 0 ]]; then
            echo "No validated release assets were collected." >&2
            exit 1
          fi

      - name: Upload all validated release assets and updater manifest once
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          assets=()
          while IFS= read -r -d '' asset; do
            assets+=("$asset")
          done < <(find release-assets -maxdepth 1 -type f -print0 | sort -z)
          assets+=(latest-stable.json latest.json)
          gh release upload "$TAG" "${assets[@]}" --clobber

      - name: Publish draft release
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          RELEASE_BODY: ${{ needs.changelog.outputs.changelog }}
          RELEASE_ID: ${{ needs.create_release.outputs.release_id }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tagName = context.ref.replace('refs/tags/', '')
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: Number(process.env.RELEASE_ID),
              tag_name: tagName,
              name: `Troupe ${tagName}`,
              body: process.env.RELEASE_BODY || '',
              draft: false,
            })

  publish_homebrew:
    name: Publish checksums and Homebrew metadata
    needs: [changelog, publish_release]
    permissions:
      contents: write
    uses: ./.github/workflows/publish-homebrew.yml
    with:
      version: ${{ needs.changelog.outputs.normalized_version }}
    secrets:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  # The image downloads and verifies the published troupe-server assets, so it
  # runs after publish_release and only on tag pushes.
  container_image:
    name: Publish container image
    needs: [changelog, publish_release]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-container-image.yml
    with:
      release_tag: ${{ github.ref_name }}
      image_tags: |
        ${{ needs.changelog.outputs.normalized_version }}
        latest

  # Releases are published with GITHUB_TOKEN, which starts no other workflows
  # except through workflow_dispatch, so dispatch the docs deploy to pick up
  # this release's openapi.yaml for the API reference page.
  refresh_docs:
    name: Refresh the docs API reference
    needs: [changelog, publish_release]
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2
        with:
          egress-policy: audit

      - name: Dispatch the landing and docs deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-landing.yml --repo "$GITHUB_REPOSITORY" --ref main
