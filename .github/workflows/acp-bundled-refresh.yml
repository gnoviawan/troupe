name: ACP bundled snapshot

# Troupe ships offline copies of the official ACP registry and of Troupe's
# registry overlay (gnoviawan/troupe-acp-registry). Once a week this checks
# them against the live sources and keeps one issue open while they differ.
# A PR opened with GITHUB_TOKEN would not run CI, so the refresh itself is
# `bun scripts/refresh-acp-bundled.mjs` in a normal PR.

on:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.x

      - run: bun install --frozen-lockfile --ignore-scripts

      - name: Compare the bundled snapshot with the live sources
        id: compare
        run: |
          if bun scripts/refresh-acp-bundled.mjs --check > report.txt; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi
          cat report.txt

      - name: Keep the tracking issue current
        env:
          GH_TOKEN: ${{ github.token }}
          STALE: ${{ steps.compare.outputs.stale }}
        run: |
          title='Bundled ACP snapshot is stale'
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ "$STALE" = "true" ]; then
            {
              echo "The offline ACP files differ from their live sources:"
              echo
              echo '```'
              cat report.txt
              echo '```'
              echo
              echo 'Run `bun scripts/refresh-acp-bundled.mjs` on a branch from `dev` and open a PR. Version bumps can break tests that pin a bundled package (for example `agent-templates.test.ts`), so check the agents whose major version moved.'
            } > body.md
            if [ -n "$number" ]; then
              gh issue edit "$number" --body-file body.md
            else
              gh issue create --title "$title" --body-file body.md
            fi
          elif [ -n "$number" ]; then
            gh issue close "$number" --comment 'The bundled ACP snapshot matches its live sources again.'
          fi
