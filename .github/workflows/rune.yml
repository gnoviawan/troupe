      - 'src/renderer/stores/workspace-store/slices/pane.ts'
      - 'src/renderer/stores/workspace-store/slices/projects.ts'
      - 'src/renderer/stores/workspace-store/slices/sync.ts'
      - 'src/renderer/stores/workspace-store/slices/tabs.ts'
      - 'src/renderer/stores/workspace-store/tree.ts'
      - 'src/renderer/types/settings.ts'
      - 'src/shared/types/antigravity-accounts.types.ts'
      - 'src/shared/types/web-protocol.types.ts'
      - 'src/renderer/components/terminal/command-editor/editor-keys.ts'
      - 'src/renderer/hooks/use-command-history.ts'
      - 'src/renderer/lib/command-editor-transport.ts'
      - 'src/renderer/lib/command-lifecycle/**'
      - 'src/renderer/lib/persistence-trim.ts'
      - 'src/renderer/stores/command-history-store.ts'
      - 'src/renderer/stores/snapshot-store.ts'
      - 'src/renderer/lib/bug-report-api.ts'
      - 'src/renderer/components/onboarding/land-onboarding.ts'
      - 'src/renderer/components/onboarding/onboarding-gate.ts'
      - 'src/renderer/components/setup/RestartingScreen.tsx'
      - 'src/renderer/components/setup/ServerSetupWizard.tsx'
  # Runs on dev save the Rust cache (`save-if` below) that PR runs restore.
  push:
    branches: [dev]
    paths:
      - '.github/workflows/rune.yml'
      - 'apps/rune/**'
      - 'scripts/rune/**'
      - 'tools/parity/vectors/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A dev run that is cancelled saves no cache.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-pin:
    name: Rune pin check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Check the Rune pin
        run: node scripts/rune/check-pin.mjs

      - name: Check the Rune patch series
        run: node scripts/rune/apply-patches.mjs

      - name: Test the Rune scripts
        run: node --test scripts/rune/*.test.mjs

  native:
    name: hello (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev mesa-vulkan-drivers libxkbcommon-x11-0 xvfb

      # Keep `toolchain` equal to apps/rune/rust-toolchain.toml's channel.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.99.1

      - name: Cache Rust
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/rune
          cache-on-failure: true
          # PR-scoped caches are invisible to other PRs and crowd the 10 GB cap.
          save-if: ${{ github.ref == 'refs/heads/dev' }}

      - name: Build hello (release)
        working-directory: apps/rune
        run: cargo build --release -p hello --features tooling

      - name: Test
        working-directory: apps/rune
        run: cargo test --workspace --all-features

      # GitHub's Ubuntu image names lavapipe's ICD lvp_icd.<arch>.json.
      - name: Snapshot hello (Linux)
        if: runner.os == 'Linux'
        working-directory: apps/rune
        run: |
          icd=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)
          VK_ICD_FILENAMES="$icd" ./target/release/hello --snap "hello-snap-${{ runner.os }}.png"

      # Waits for the window, clicks the button, reads "Pressed 1" back from the
      # element tree and saves a frame through the driver's `snap`.
      - name: Drive hello (Linux)
        if: runner.os == 'Linux'
        working-directory: apps/rune
        run: |
          icd=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)
          VK_ICD_FILENAMES="$icd" xvfb-run -a -s '-screen 0 1280x800x24' \
            bash ../../scripts/rune/drive-hello.sh ./target/release/hello hello-drive-Linux.png

      # `cargo test` built the example; renders Troupe dark's token swatches.
      - name: Snapshot theme swatches (Linux)
        if: runner.os == 'Linux'
        working-directory: apps/rune
        run: |
          icd=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)
          VK_ICD_FILENAMES="$icd" ./target/debug/examples/theme-swatches --scene termul --snap theme-swatches-Linux.png

      # `cargo test` builds troupe-dev's libraries but not its binary (it has no
      # integration tests). With no TROUPE_SERVER_URL it draws the shell frame
      # unconnected.
      - name: Snapshot the Troupe shell (Linux)
        if: runner.os == 'Linux'
        working-directory: apps/rune
        run: |
          cargo build -p troupe-dev
          icd=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)
          VK_ICD_FILENAMES="$icd" ./target/debug/troupe-dev --snap troupe-dev-Linux.png

      # The desktop app (troupe-preview). A headless run starts no server, so this
      # draws the shell unconnected at the desktop window's 1200x800 default.
      - name: Snapshot the desktop app (Linux)
        if: runner.os == 'Linux'
        working-directory: apps/rune
        run: |
          cargo build -p troupe-desktop
          icd=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)
          TROUPE_PREVIEW_DATA_DIR="$RUNNER_TEMP/troupe-preview" VK_ICD_FILENAMES="$icd" \
            ./target/debug/troupe-preview --snap troupe-preview-Linux.png

      # `cargo test` built the gallery binary; renders one design-system scene.
      - name: Snapshot the gallery (Linux)
        if: runner.os == 'Linux'
        working-directory: apps/rune
        run: |
          icd=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)
          ./target/debug/gallery --list-scenes > gallery-scenes-Linux.txt
          VK_ICD_FILENAMES="$icd" ./target/debug/gallery --scene button.variants --size 560x456 --scale 2 --snap gallery-button-variants-Linux.png

      - name: Snapshot hello (macOS)
        if: runner.os == 'macOS'
        working-directory: apps/rune
        run: ./target/release/hello --snap "hello-snap-${{ runner.os }}.png"

      - name: Snapshot hello (Windows)
        if: runner.os == 'Windows'
        working-directory: apps/rune
        run: .\target\release\hello.exe --snap "hello-snap-${{ runner.os }}.png"

      - name: Upload snapshot
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: hello-snap-${{ runner.os }}
          path: apps/rune/hello-snap-${{ runner.os }}.png

      - name: Upload theme swatches (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: theme-swatches-Linux
          path: apps/rune/theme-swatches-Linux.png

      - name: Upload the gallery snapshot (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: gallery-Linux
          path: |
            apps/rune/gallery-button-variants-Linux.png
            apps/rune/gallery-scenes-Linux.txt

      - name: Upload the Troupe shell snapshot (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: troupe-dev-Linux
          path: apps/rune/troupe-dev-Linux.png

      - name: Upload the desktop app snapshot (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: troupe-preview-Linux
          path: apps/rune/troupe-preview-Linux.png

      - name: Upload driven frame (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: hello-drive-Linux
          path: apps/rune/hello-drive-Linux.png

  wasm:
    name: hello (wasm32)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.99.1
          targets: wasm32-unknown-unknown

      - name: Cache Rust
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/rune
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/dev' }}

      - name: Check client, the terminal and editor models and the flow canvas (wasm32)
        working-directory: apps/rune
        run: cargo check --target wasm32-unknown-unknown -p client -p troupe-term -p troupe-editor -p troupe-flow

      # Off Unix the live driver is a no-op; this proves it still builds.
      - name: Check hello with the live driver (wasm32)
        working-directory: apps/rune
        run: cargo check -p hello --features tooling --target wasm32-unknown-unknown

      - name: Check the theme, ui and gallery crates (wasm32)
        working-directory: apps/rune
        run: cargo check -p theme -p ui -p gallery --target wasm32-unknown-unknown

      - name: Check the Troupe app root and web entry (wasm32)
        working-directory: apps/rune
        run: cargo check -p troupe-app -p troupe-web --target wasm32-unknown-unknown

      # web-build.sh requires a wasm-bindgen CLI whose version equals the one in
      # this workspace's Cargo.lock.
      - name: Install wasm-bindgen-cli (Cargo.lock version)
        working-directory: apps/rune
        run: |
          version=$(node -e "const t = require('node:fs').readFileSync('Cargo.lock', 'utf8'); console.log(t.match(/name = \"wasm-bindgen\"\nversion = \"([^\"]+)\"/)[1])")
          cargo install wasm-bindgen-cli --version "$version" --locked

      # Rune's build script lives in the git checkout Cargo made of the pinned
      # rev; `cargo metadata` reports it, and the script writes a static folder
      # (app.js, app_bg.wasm, index.html, Inter faces) under target/web.
      - name: Build the web bundle
        working-directory: apps/rune
        run: |
          rune_root=$(node -e "
            const m = JSON.parse(require('node:child_process').execSync('cargo metadata --format-version 1 --filter-platform wasm32-unknown-unknown', { encoding: 'utf8', maxBuffer: 256 * 1024 * 1024 }));
            const p = m.packages.find((p) => p.name === 'rune');
            const path = require('node:path');
            // crates/rune/Cargo.toml -> the checkout's root.
            console.log(path.dirname(path.dirname(path.dirname(p.manifest_path))));
          ")
          bash "$rune_root/scripts/web-build.sh" hello --out target/web
          bash "$rune_root/scripts/web-build.sh" gallery --out target/web-gallery
          bash "$rune_root/scripts/web-build.sh" troupe-web --out target/web-troupe --no-html
          cp crates/web/index.html target/web-troupe/

      - name: Upload the Troupe web bundle
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: troupe-web
          path: apps/rune/target/web-troupe/

      # The CJK and emoji faces the gallery loads after its first frame, pinned by SHA-256.
      - name: Fetch the gallery's web fonts
        run: node scripts/rune/fetch-web-fonts.mjs --out apps/rune/target/web-gallery/fonts

      - name: Upload the gallery web bundle
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: gallery-web
          path: apps/rune/target/web-gallery/

      - name: Upload web bundle
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: hello-web
          path: apps/rune/target/web/
