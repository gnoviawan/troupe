name: Protocol

# Tests the troupe-protocol crate on the toolchain src-tauri uses (1.97) and
# the one apps/rune pins (1.99.1), checks it builds for wasm32, and fails when
# the committed schema or the generated TypeScript is stale.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, develop, dev]
    paths:
      - '.github/workflows/protocol.yml'
      - 'crates/troupe-protocol/**'
      - 'scripts/protocol/**'
      - 'src/shared/types/generated/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  crate:
    name: troupe-protocol (Rust ${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        toolchain: ['1.97.1', '1.99.1']
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ matrix.toolchain }}
          targets: wasm32-unknown-unknown
          components: clippy

      - name: Cache Rust
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: crates/troupe-protocol
          key: ${{ matrix.toolchain }}
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/dev' }}

      - name: Test (schema and fixture round trips)
        working-directory: crates/troupe-protocol
        run: cargo test --locked

      - name: Clippy
        working-directory: crates/troupe-protocol
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Check wasm32
        working-directory: crates/troupe-protocol
        run: cargo check --locked --target wasm32-unknown-unknown

  generated-ts:
    name: Generated TypeScript is fresh
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Test the generator
        run: node --test scripts/protocol/gen-ts.test.mjs
