name: PR Validation

on:
  pull_request:
    # No `edited`: a title or description edit runs pr-metadata.yml only. An
    # edit run here would replace this run's job results with skipped ones and
    # cancel the queued run for the latest commit.
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, develop, dev]
  # Pushes to dev run the Rust jobs so rust-cache saves dev-scoped entries.
  # A PR can restore caches from its base branch but not from other PRs.
  push:
    branches: [dev]

permissions:
  contents: read

env:
  # File and line tables only. Backtraces keep file:line, and codegen, links
  # and the cache get smaller. The test profile inherits this from dev.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Merges to dev land minutes apart. Cancelling would drop the cache save.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Job-level filter. Do not add on.pull_request.paths to this workflow: a
  # skipped workflow reports nothing, while a skipped job reports success.
  changes:
    name: Detect Rust changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect Rust-relevant changes
        id: filter
        shell: bash
        env:
          # A push compares against the previous tip of the branch.
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail

          # A change to this workflow must still run these jobs.
          # CodeQL rust stays in its analyze matrix. Skipping that upload
          # makes the CodeQL check fail with "1 configuration not found".
          # scripts/canvas and the pin are inputs of Rust Checks.
          # check-server-no-gui-libs.sh is an input of Standalone Server Build.
          # build:web inputs are not listed. Those jobs embed the bundle only.
          is_rust_relevant() {
            case "$1" in
              src-tauri|src-tauri/*) return 0 ;;
              .cargo|.cargo/*) return 0 ;;
              Cargo.toml|*/Cargo.toml|Cargo.lock|*/Cargo.lock) return 0 ;;
              rust-toolchain|*/rust-toolchain) return 0 ;;
              rust-toolchain.toml|*/rust-toolchain.toml) return 0 ;;
              rustfmt.toml|*/rustfmt.toml|clippy.toml|*/clippy.toml) return 0 ;;
              .github/workflows/pr-validation.yml) return 0 ;;
              canvas/figcraft.pin) return 0 ;;
              scripts/canvas|scripts/canvas/*) return 0 ;;
              scripts/check-server-no-gui-libs.sh) return 0 ;;
              *) return 1 ;;
            esac
          }

          if ! [[ "$BASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Base SHA is missing or not 40 hex characters. Rust jobs run."
            echo "rust=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git cat-file -e "${BASE_SHA}^{commit}"; then
            echo "Base commit ${BASE_SHA} is not in this checkout. Rust jobs run."
            echo "rust=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # -z plus quotePath=false keeps names that Git would otherwise quote.
          # Read each NUL-terminated path from the stream. Do not store that
          # output in a shell variable.
          rust=false
          while IFS= read -r -d '' file; do
            [ -n "$file" ] || continue
            if is_rust_relevant "$file"; then
              echo "rust path: $file"
              rust=true
            fi
          done < <(git -c core.quotePath=false diff --name-only --no-renames -z "$BASE_SHA" HEAD)
          echo "Rust-relevant changes: $rust"
          echo "rust=$rust" >> "$GITHUB_OUTPUT"

  validate:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.x

      - name: Install Bun dependencies
        run: bun install --frozen-lockfile

      - name: Rebrand check (no old product name)
        run: bun run rebrand --check

      - name: Biome (lint + format + imports)
        run: bun run ci

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Shell tests (installer and Homebrew cask)
        run: bun run test:shell

  rust-checks:
    name: Rust Checks
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-22.04
    # Clippy and test run about 14 minutes on a cold cache, and the
    # post-job cache save adds about one more.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy

      - name: Cache Rust
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          cache-on-failure: true
          # PR-scoped caches are invisible to other PRs and crowd the 10 GB cap.
          save-if: ${{ github.ref == 'refs/heads/dev' }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.x

      - name: Install Bun dependencies
        run: bun install --frozen-lockfile

      # Build the Vite web bundle BEFORE the Rust checks so rust-embed embeds a
      # non-empty dist-web/ — the web::assets tests then exercise the embedded-
      # serving OK-path (200 + correct Content-Type + caching), not just the
      # empty-embed 404 branch. (A missing dist-web/ would still compile green
      # in debug via allow_missing, but the OK-path assertions need the bundle.)
      - name: Build web client (dist-web/)
        run: bun run build:web

      - name: Assert dist-web/index.html exists
        run: test -f dist-web/index.html && test -s dist-web/index.html

      # The pin must name the same tag as the figcraft-mcp dependency (skips
      # with a message until src-tauri depends on it), and its bundle must
      # download and match the pinned sha256.
      - name: Check figcraft pin
        run: bun scripts/canvas/check-figcraft-pin.mjs

      - name: Fetch and verify figcraft bundle (canvas/bundle/)
        run: bun scripts/canvas/fetch-figcraft-bundle.mjs

      # No separate `cargo check --all-targets`: clippy type-checks the same
      # targets and features and fails on any compile error.
      - name: Cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Cargo test
        working-directory: src-tauri
        run: cargo test

  web-build:
    name: Web Client Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.x

      - name: Install Bun dependencies
        run: bun install --frozen-lockfile

      - name: Build web client (dist-web/)
        run: bun run build:web

      - name: Assert dist-web/index.html exists
        run: test -f dist-web/index.html && test -s dist-web/index.html

  standalone-server-build:
    name: Standalone Server Build
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache Rust
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          cache-on-failure: true
          # PR-scoped caches are invisible to other PRs and crowd the 10 GB cap.
          save-if: ${{ github.ref == 'refs/heads/dev' }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.x

      - name: Install Bun dependencies
        run: bun install --frozen-lockfile

      # Build the Vite web bundle BEFORE the cargo build so rust-embed embeds a
      # non-empty `dist-web/` (build sequencing). A release build with a missing
      # bundle fails clearly via the `web_embed_missing` compile_error in
      # assets.rs; this dev build compiles green regardless (allow_missing), but
      # the embedded bundle is exercised with real content.
      - name: Build web client (dist-web/)
        run: bun run build:web

      - name: Assert dist-web/index.html exists
        run: test -f dist-web/index.html && test -s dist-web/index.html

      - name: Build troupe-server (native host)
        working-directory: src-tauri
        run: cargo build --bin troupe-server --features standalone-server

      - name: Clippy troupe-server (feature on)
        working-directory: src-tauri
        run: cargo clippy --bin troupe-server --features standalone-server -- -D warnings

      # The headless server must not link GTK/WebKit (#1349); it has to start on
      # hosts without them. Runs against the dev build above (rust-lld).
      - name: Assert troupe-server links no GUI libraries
        run: scripts/check-server-no-gui-libs.sh src-tauri/target/debug/troupe-server

  rust-windows-check:
    name: Rust Windows Smoke Check
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    # A cold-cache run builds for up to about 18 min, and the post-job cache
    # save adds up to about 6 min. The budget covers both.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy

      - name: Cache Rust
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          cache-on-failure: true
          # PR-scoped caches are invisible to other PRs and crowd the 10 GB cap.
          save-if: ${{ github.ref == 'refs/heads/dev' }}

      # No web build here: a debug build reads dist-web/ from disk at run time
      # (rust-embed without debug-embed, #[allow_missing]), so the bundle does
      # not change what compiles. Web Build (Windows) checks the bundle builds.
      - name: Cargo check
        working-directory: src-tauri
        run: cargo check --all-targets

      - name: Build troupe-server (Windows host)
        working-directory: src-tauri
        run: cargo build --bin troupe-server --features standalone-server

  web-build-windows:
    name: Web Build (Windows)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.x

      - name: Install Bun dependencies
        run: bun install --frozen-lockfile

      - name: Build web client (dist-web/)
        run: bun run build:web

      - name: Assert dist-web/index.html exists
        shell: bash
        run: test -f dist-web/index.html && test -s dist-web/index.html

  build-check:
    name: Verify Tauri Frontend Build
    # !cancelled() replaces the default success() check. A path-skipped Rust
    # job must not skip this job. A failed Rust job still does.
    if: >-
      !cancelled() &&
      needs.changes.result == 'success' &&
      needs.validate.result == 'success' &&
      needs.web-build.result == 'success' &&
      (needs.rust-checks.result == 'success' || needs.rust-checks.result == 'skipped') &&
      (needs.rust-windows-check.result == 'success' || needs.rust-windows-check.result == 'skipped') &&
      (needs.standalone-server-build.result == 'success' || needs.standalone-server-build.result == 'skipped')
    needs: [changes, validate, rust-checks, rust-windows-check, web-build, standalone-server-build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.x

      - name: Install Bun dependencies
        run: bun install --frozen-lockfile

      - name: Build Tauri frontend assets
        run: bun run build:frontend:tauri
