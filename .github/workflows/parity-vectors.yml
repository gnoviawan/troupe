name: Parity vectors

# Records the store test vectors from the TypeScript stores and fails when
# tools/parity/vectors/out/ no longer matches them: a pinned source changed
# (the manifest's hashes) or a store now does something else (the vector
# files). The Rust model replays the same files in the Rune workflow, so a
# renderer change that breaks parity fails its own PR here. Re-record with
#   RECORD_VECTORS=1 bun run test tools/parity/vectors
# Every recorder source must match one of the paths below; record.ts checks.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, develop, dev, "rune/r6a2-acp-model-*"]
    paths:
      - '.github/workflows/parity-vectors.yml'
      - 'tools/parity/vectors/**'
      - 'src/renderer/**'
      - 'src/shared/**'
      - 'package.json'
      - 'bun.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    name: Store vectors are current
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.x

      - name: Install Bun dependencies
        run: bun install --frozen-lockfile

      - name: Record and compare
        run: bun scripts/test.ts tools/parity/vectors/record.test.ts tools/parity/vectors/record-acp.test.ts tools/parity/vectors/record-composer.test.ts tools/parity/vectors/record-terminal.test.ts
